<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>在线简谱编辑器</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">简</span>
          <span class="brand-text">在线简谱编辑器</span>
        </div>
        <div class="topbar-actions">
          <button type="button" class="btn" id="btn-import-midi">导入 MIDI</button>
          <button type="button" class="btn" id="btn-export-midi">导出 MIDI</button>
          <button type="button" class="btn" id="btn-open-json">打开 JSON</button>
          <button type="button" class="btn" id="btn-save-json">保存 JSON</button>
          <button type="button" class="btn" id="btn-export-svg">导出 SVG</button>
          <button type="button" class="btn" id="btn-export-png">导出 PNG</button>
          <button type="button" class="btn" id="btn-print">打印</button>
          <button type="button" class="btn btn-ghost" id="btn-help">快捷键</button>
        </div>
      </header>

      <div class="toolbar" id="toolbar" role="toolbar" aria-label="简谱编辑工具栏"></div>

      <div class="transport" id="transport"></div>

      <main class="workspace">
        <aside class="sidepanel" id="meta-panel"></aside>
        <section class="score-area">
          <div class="score-scroll" id="score-scroll"></div>
        </section>
      </main>

      <footer class="statusbar">
        <span id="status-hint"></span>
        <span id="status-info"></span>
      </footer>
    </div>

    <input type="file" id="file-midi" accept=".mid,.midi" hidden />
    <input type="file" id="file-json" accept=".json,application/json" hidden />

    <div class="dialog-layer" id="dialog-layer" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
